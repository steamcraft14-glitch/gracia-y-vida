<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gracia & Vida</title>
  <!-- Tailwind CSS para un diseño PRO rápido -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0B0F1E; }
  </style>
</head>
<body class="text-white min-h-screen flex">

  <!-- Menú Lateral -->
  <aside class="w-64 bg-gray-900 border-r border-blue-900 hidden md:block">
    <div class="p-6">
      <h2 class="text-2xl font-black text-white">Panel <span class="text-blue-500">Pro</span></h2>
      <p class="text-xs text-gray-400 mt-1">Gracia & Vida Huechuraba</p>
    </div>
    <nav class="mt-6">
      <a href="#" class="flex items-center px-6 py-3 bg-blue-600 bg-opacity-20 text-blue-400 border-r-4 border-blue-500 font-semibold">
        📅 Evento Destacado
      </a>
      <a href="#" class="flex items-center px-6 py-3 text-gray-400 hover:text-white hover:bg-gray-800 transition">
        🔗 Links (Próximamente)
      </a>
    </nav>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 p-8">
    <header class="mb-8">
      <h1 class="text-3xl font-bold">Editar Evento Destacado</h1>
      <p class="text-gray-400 mt-2">Los cambios se reflejarán inmediatamente en la página principal.</p>
    </header>

    <!-- Tarjeta del Formulario -->
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-2xl shadow-lg">
      <form id="form-evento" class="space-y-6">
        
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">Título del Evento</label>
          <input type="text" id="titulo" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="Ej: Casa de Oración" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">Fecha y Hora</label>
          <input type="text" id="fecha" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="Ej: 5 de Septiembre · 10:00 - 22:00" required>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">Descripción</label>
          <textarea id="descripcion" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="Breve descripción del evento..." required></textarea>
        </div>

        <button type="submit" id="btn-guardar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-[0_0_15px_rgba(37,99,235,0.4)]">
          Guardar Cambios
        </button>
        
        <!-- Mensaje de éxito -->
        <p id="mensaje-exito" class="text-green-400 text-center text-sm font-semibold hidden">¡Evento actualizado con éxito!</p>
      </form>
    </div>
  </main>

  <!-- LÓGICA DE FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Tu configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDIibIy0oBXya6jQLLmtzq2TFB-Jiaa1_o",
      authDomain: "gracia-vida.firebaseapp.com",
      projectId: "gracia-vida",
      storageBucket: "gracia-vida.firebasestorage.app",
      messagingSenderId: "901432766248",
      appId: "1:901432766248:web:8dcbb7048284c152ae2a1d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Referencia al documento en la base de datos
    const eventoRef = doc(db, "iglesia", "evento_destacado");

    // Elementos del DOM
    const inputTitulo = document.getElementById('titulo');
    const inputFecha = document.getElementById('fecha');
    const inputDesc = document.getElementById('descripcion');
    const form = document.getElementById('form-evento');
    const btnGuardar = document.getElementById('btn-guardar');
    const mensajeExito = document.getElementById('mensaje-exito');

    // 1. Cargar datos actuales al abrir la página
    async function cargarDatos() {
      const docSnap = await getDoc(eventoRef);
      if (docSnap.exists()) {
        const datos = docSnap.data();
        inputTitulo.value = datos.titulo || "";
        inputFecha.value = datos.fecha || "";
        inputDesc.value = datos.descripcion || "";
      }
    }
    cargarDatos();

    // 2. Guardar datos al presionar el botón
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnGuardar.textContent = "Guardando...";
      btnGuardar.classList.add("opacity-50", "cursor-not-allowed");

      try {
        await setDoc(eventoRef, {
          titulo: inputTitulo.value,
          fecha: inputFecha.value,
          descripcion: inputDesc.value
        });
        
        // Mostrar mensaje de éxito
        mensajeExito.classList.remove('hidden');
        setTimeout(() => mensajeExito.classList.add('hidden'), 3000);
      } catch (error) {
        console.error("Error al guardar: ", error);
        alert("Hubo un error al guardar. Revisa la consola.");
      } finally {
        btnGuardar.textContent = "Guardar Cambios";
        btnGuardar.classList.remove("opacity-50", "cursor-not-allowed");
      }
    });
  </script>
</body>
</html>
