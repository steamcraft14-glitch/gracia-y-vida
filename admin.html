<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gracia & Vida</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #0B0F1E; color: #fff; }
    .tab-active { @apply bg-blue-600 border-blue-500; }
    .tab-inactive { @apply bg-gray-800 border-gray-700 hover:bg-gray-700; }
  </style>
</head>
<body class="min-h-screen flex text-white">

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" class="w-full h-screen bg-gradient-to-br from-gray-900 to-gray-800 flex items-center justify-center">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 max-w-md w-full shadow-2xl">
      <h2 class="text-3xl font-black text-center mb-2">Gracia <span class="text-blue-400">&</span> Vida</h2>
      <p class="text-gray-400 text-center text-sm mb-8">Panel de Administración</p>
      
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">Correo</label>
          <input type="email" id="login-email" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="tu@email.com" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-300 mb-2">Contraseña</label>
          <input type="password" id="login-password" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-[0_0_15px_rgba(37,99,235,0.4)]">
          Ingresar
        </button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- PANTALLA DE ADMIN (oculta al inicio) -->
  <div id="admin-screen" class="w-full hidden flex-col">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 border-r border-blue-900 h-screen flex flex-col fixed">
      <div class="p-6 border-b border-gray-800">
        <h2 class="text-2xl font-black">Panel <span class="text-blue-500">Admin</span></h2>
        <p class="text-xs text-gray-400 mt-1">Gracia & Vida</p>
      </div>
      
      <nav class="flex-1 mt-6 space-y-2 px-4">
        <button class="nav-tab tab-active w-full text-left px-4 py-3 rounded-lg border-2 border-blue-500 bg-blue-600 bg-opacity-20 font-semibold" data-tab="evento">
          ⚡ Evento
        </button>
        <button class="nav-tab tab-inactive w-full text-left px-4 py-3 rounded-lg border-2 border-gray-700 font-semibold" data-tab="horarios">
          📅 Horarios
        </button>
        <button class="nav-tab tab-inactive w-full text-left px-4 py-3 rounded-lg border-2 border-gray-700 font-semibold" data-tab="secciones">
          📋 Secciones
        </button>
      </nav>
      
      <div class="p-6 border-t border-gray-800">
        <button id="logout-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-4 rounded-lg transition">
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 overflow-auto ml-64">
      <div class="p-8">
        
        <!-- TAB: EVENTO DESTACADO -->
        <div id="tab-evento" class="tab-content">
          <h1 class="text-3xl font-bold mb-6">Evento Destacado</h1>
          <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-2xl">
            <form id="form-evento" class="space-y-6">
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Título del evento</label>
                <input type="text" id="evento-titulo" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" required>
              </div>
              
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Fecha y Hora</label>
                <input type="text" id="evento-fecha" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" placeholder="Ej: 5 de Septiembre · 10:00 - 22:00" required>
              </div>
              
              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-2">Descripción</label>
                <textarea id="evento-descripcion" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-500" required></textarea>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-300 mb-4">Bloques (Agenda)</label>
                <div id="bloques-container" class="space-y-3 mb-4"></div>
                <button type="button" id="btn-agregar-bloque" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg transition">
                  + Agregar Bloque
                </button>
              </div>

              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                💾 Guardar Evento
              </button>
              <p id="evento-mensaje" class="text-green-400 text-center text-sm font-semibold hidden">✓ Evento actualizado</p>
            </form>
          </div>
        </div>

        <!-- TAB: HORARIOS -->
        <div id="tab-horarios" class="tab-content hidden">
          <h1 class="text-3xl font-bold mb-6">Reuniones Semanales</h1>
          <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-2xl">
            <div id="horarios-container" class="space-y-3 mb-4"></div>
            <button id="btn-agregar-horario" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg transition mb-4">
              + Agregar Reunión
            </button>
            <button id="btn-guardar-horarios" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition">
              💾 Guardar Horarios
            </button>
            <p id="horarios-mensaje" class="text-green-400 text-sm font-semibold mt-4 hidden">✓ Horarios actualizados</p>
          </div>
        </div>

        <!-- TAB: SECCIONES -->
        <div id="tab-secciones" class="tab-content hidden">
          <h1 class="text-3xl font-bold mb-6">Secciones y Links</h1>
          <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 max-w-4xl">
            <div id="secciones-container" class="space-y-6 mb-4"></div>
            <button id="btn-agregar-seccion" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg transition mb-4">
              + Agregar Sección
            </button>
            <button id="btn-guardar-secciones" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition">
              💾 Guardar Secciones
            </button>
            <p id="secciones-mensaje" class="text-green-400 text-sm font-semibold mt-4 hidden">✓ Secciones actualizadas</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- FIREBASE & LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ⚠️ REEMPLAZA ESTO CON TUS CREDENCIALES DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDIibIy0oBXya6jQLLmtzq2TFB-Jiaa1_o",
      authDomain: "gracia-vida.firebaseapp.com",
      projectId: "gracia-vida",
      storageBucket: "gracia-vida.firebasestorage.app",
      messagingSenderId: "901432766248",
      appId: "1:901432766248:web:8dcbb7048284c152ae2a1d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // ===== AUTENTICACIÓN =====
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        cargarDatos();
      } else {
        currentUser = null;
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errorEl = document.getElementById('login-error');
      
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        errorEl.textContent = 'Email o contraseña incorrectos';
        errorEl.classList.remove('hidden');
        setTimeout(() => errorEl.classList.add('hidden'), 3000);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth);
    });

    // ===== NAVEGACIÓN DE TABS =====
    document.querySelectorAll('.nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-tab');
        
        document.querySelectorAll('.nav-tab').forEach(b => {
          b.classList.remove('tab-active');
          b.classList.add('tab-inactive');
        });
        btn.classList.add('tab-active');
        btn.classList.remove('tab-inactive');
        
        document.querySelectorAll('.tab-content').forEach(content => {
          content.classList.add('hidden');
        });
        document.getElementById('tab-' + tab).classList.remove('hidden');
      });
    });

    // ===== EVENTO DESTACADO =====
    async function cargarEvento() {
      const docSnap = await getDoc(doc(db, "iglesia", "evento_destacado"));
      if (docSnap.exists()) {
        const datos = docSnap.data();
        document.getElementById('evento-titulo').value = datos.titulo || "";
        document.getElementById('evento-fecha').value = datos.fecha || "";
        document.getElementById('evento-descripcion').value = datos.descripcion || "";
        
        document.getElementById('bloques-container').innerHTML = "";
        (datos.bloques || []).forEach((bloque, idx) => {
          agregarBloqueUI(bloque.hora, bloque.nombre, idx);
        });
      }
    }

    function agregarBloqueUI(hora = "", nombre = "") {
      const container = document.getElementById('bloques-container');
      
      const div = document.createElement('div');
      div.className = 'flex gap-3 items-end p-3 bg-gray-900 rounded border border-gray-700';
      div.innerHTML = `
        <div class="flex-1">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Hora</label>
          <input type="text" class="bloque-hora w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-sm" value="${hora}" placeholder="10:00-12:00">
        </div>
        <div class="flex-1">
          <label class="block text-xs font-semibold text-gray-400 mb-1">Tema</label>
          <input type="text" class="bloque-nombre w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-sm" value="${nombre}" placeholder="Nombre del bloque">
        </div>
        <button type="button" class="btn-eliminar-bloque bg-red-600 hover:bg-red-500 px-3 py-2 rounded text-white font-bold h-10">
          ✕
        </button>
      `;
      
      div.querySelector('.btn-eliminar-bloque').addEventListener('click', () => {
        div.remove();
      });
      
      container.appendChild(div);
    }

    document.getElementById('btn-agregar-bloque').addEventListener('click', () => {
      agregarBloqueUI();
    });

    document.getElementById('form-evento').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const bloques = [];
      document.querySelectorAll('#bloques-container > div').forEach(div => {
        bloques.push({
          hora: div.querySelector('.bloque-hora').value,
          nombre: div.querySelector('.bloque-nombre').value
        });
      });
      
      try {
        await setDoc(doc(db, "iglesia", "evento_destacado"), {
          titulo: document.getElementById('evento-titulo').value,
          fecha: document.getElementById('evento-fecha').value,
          descripcion: document.getElementById('evento-descripcion').value,
          bloques: bloques
        });
        
        mostrarMensaje('evento-mensaje');
      } catch (error) {
        console.error('Error:', error);
      }
    });

    // ===== HORARIOS =====
    async function cargarHorarios() {
      const docSnap = await getDoc(doc(db, "iglesia", "reuniones"));
      const reuniones = docSnap.exists() ? (docSnap.data().items || []) : [];
      
      document.getElementById('horarios-container').innerHTML = "";
      reuniones.forEach((r) => {
        agregarHorarioUI(r.dia, r.evento, r.hora);
      });
    }

    function agregarHorarioUI(dia = "", evento = "", hora = "") {
      const container = document.getElementById('horarios-container');
      
      const div = document.createElement('div');
      div.className = 'grid grid-cols-3 gap-3 items-end p-3 bg-gray-900 rounded border border-gray-700';
      div.innerHTML = `
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Día</label>
          <input type="text" class="horario-dia w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-sm" value="${dia}" placeholder="Lunes">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Evento</label>
          <input type="text" class="horario-evento w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-sm" value="${evento}" placeholder="Oración Matutina">
        </div>
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block text-xs font-semibold text-gray-400 mb-1">Hora</label>
            <input type="text" class="horario-hora w-full bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white text-sm" value="${hora}" placeholder="08:00">
          </div>
          <button type="button" class="btn-eliminar-horario bg-red-600 hover:bg-red-500 px-3 rounded text-white font-bold h-10 mt-auto">
            ✕
          </button>
        </div>
      `;
      
      div.querySelector('.btn-eliminar-horario').addEventListener('click', () => {
        div.remove();
      });
      
      container.appendChild(div);
    }

    document.getElementById('btn-agregar-horario').addEventListener('click', () => {
      agregarHorarioUI();
    });

    document.getElementById('btn-guardar-horarios').addEventListener('click', async () => {
      const reuniones = [];
      document.querySelectorAll('#horarios-container > div').forEach(div => {
        reuniones.push({
          dia: div.querySelector('.horario-dia').value,
          evento: div.querySelector('.horario-evento').value,
          hora: div.querySelector('.horario-hora').value
        });
      });
      
      try {
        await setDoc(doc(db, "iglesia", "reuniones"), {
          items: reuniones
        });
        mostrarMensaje('horarios-mensaje');
      } catch (error) {
        console.error('Error:', error);
      }
    });

    // ===== SECCIONES =====
    async function cargarSecciones() {
      const docSnap = await getDoc(doc(db, "iglesia", "secciones"));
      const secciones = docSnap.exists() ? (docSnap.data().items || []) : [];
      
      document.getElementById('secciones-container').innerHTML = "";
      secciones.forEach((sec) => {
        agregarSeccionUI(sec.titulo, sec.links || []);
      });
    }

    function agregarSeccionUI(titulo = "", links = []) {
      const container = document.getElementById('secciones-container');
      
      const div = document.createElement('div');
      div.className = 'p-4 bg-gray-900 rounded border border-gray-700';
      div.innerHTML = `
        <div class="mb-4 flex justify-between items-center">
          <input type="text" class="seccion-titulo flex-1 bg-gray-800 border border-gray-600 rounded px-3 py-2 text-white font-semibold" value="${titulo}" placeholder="Nombre de la sección">
          <button type="button" class="btn-eliminar-seccion bg-red-600 hover:bg-red-500 px-3 py-2 rounded text-white font-bold ml-2">
            ✕
          </button>
        </div>
        <div class="seccion-links space-y-2 mb-3"></div>
        <button type="button" class="btn-agregar-link bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded text-white text-sm font-bold">
          + Link
        </button>
      `;
      
      const linksContainer = div.querySelector('.seccion-links');
      links.forEach((link) => {
        agregarLinkUI(linksContainer, link.nombre || "", link.url || "", link.descripcion || "");
      });
      
      div.querySelector('.btn-agregar-link').addEventListener('click', () => {
        agregarLinkUI(linksContainer);
      });
      
      div.querySelector('.btn-eliminar-seccion').addEventListener('click', () => {
        div.remove();
      });
      
      container.appendChild(div);
    }

    function agregarLinkUI(container, nombre = "", url = "", desc = "") {
      const div = document.createElement('div');
      div.className = 'grid grid-cols-3 gap-2 p-2 bg-gray-800 rounded';
      div.innerHTML = `
        <input type="text" class="link-nombre bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm" value="${nombre}" placeholder="Nombre">
        <input type="text" class="link-url bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm" value="${url}" placeholder="URL">
        <div class="flex gap-2">
          <input type="text" class="link-desc flex-1 bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm" value="${desc}" placeholder="Descripción">
          <button type="button" class="btn-eliminar-link bg-red-600 hover:bg-red-500 px-2 rounded text-white text-sm font-bold">
            ✕
          </button>
        </div>
      `;
      
      div.querySelector('.btn-eliminar-link').addEventListener('click', () => {
        div.remove();
      });
      
      container.appendChild(div);
    }

    document.getElementById('btn-agregar-seccion').addEventListener('click', () => {
      agregarSeccionUI();
    });

    document.getElementById('btn-guardar-secciones').addEventListener('click', async () => {
      const secciones = [];
      document.querySelectorAll('#secciones-container > div').forEach(secDiv => {
        const titulo = secDiv.querySelector('.seccion-titulo').value;
        const links = [];
        secDiv.querySelectorAll('.seccion-links > div').forEach(linkDiv => {
          links.push({
            nombre: linkDiv.querySelector('.link-nombre').value,
            url: linkDiv.querySelector('.link-url').value,
            descripcion: linkDiv.querySelector('.link-desc').value
          });
        });
        
        if (titulo.trim()) {
          secciones.push({ titulo, links });
        }
      });
      
      try {
        await setDoc(doc(db, "iglesia", "secciones"), {
          items: secciones
        });
        mostrarMensaje('secciones-mensaje');
      } catch (error) {
        console.error('Error:', error);
      }
    });

    // ===== UTILIDADES =====
    function mostrarMensaje(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 2000);
    }

    async function cargarDatos() {
      await Promise.all([
        cargarEvento(),
        cargarHorarios(),
        cargarSecciones()
      ]);
    }
  </script>
</body>
</html>
