<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Gracia & Vida Huechuraba</title>
  <link rel="icon" type="image/png" href="logo.png" />
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       CONFIGURACIÓN FÁCIL DE EDITAR
       Cambia los colores aquí y afectan todo el sitio
    ============================================= */
    :root {
      --color-fondo:        #0B0F1E;
      --color-fondo-card:   #111827;
      --color-borde:        #1E3A8A;
      --color-azul:         #2563EB;
      --color-azul-claro:   #3B82F6;
      --color-blanco:       #FFFFFF;
      --color-texto-suave:  #94A3B8;
      --color-evento:       #2563EB;
      --font-principal:     'Montserrat', sans-serif;
      --radio-card:         14px;
      --max-ancho:          480px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      overflow-x: hidden;
      width: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-principal);
      background-color: var(--color-fondo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
      color: var(--color-blanco);
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }

    @media (min-width: 1024px) {
      body {
        padding: 48px 0 64px;
      }
    }

    @media (min-width: 1200px) {
      body {
        padding: 60px 0 80px;
      }
    }

    /* ---- FONDO ESTRELLADO SUTIL ---- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(37,99,235,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(30,58,138,0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .contenedor {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max-ancho);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      overflow-x: hidden;
    }

    @media (min-width: 1024px) {
      .contenedor {
        max-width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 0 40px;
        align-items: start;
        overflow-x: visible;
      }
    }

    @media (min-width: 1400px) {
      .contenedor {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 28px;
        padding: 0 60px;
      }
    }

    /* ---- LOGO / CABECERA ---- */
    .cabecera {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (min-width: 1024px) {
      .cabecera {
        grid-column: 1 / -1;
        margin-bottom: 24px;
      }
    }

    .logo-cruz {
      width: 200px;
      height: 200px;
      position: relative;
      animation: pulso 3s ease-in-out infinite;
    }

    @media (min-width: 1024px) {
      .logo-cruz {
        width: 240px;
        height: 240px;
      }
    }

    @media (min-width: 1200px) {
      .logo-cruz {
        width: 280px;
        height: 280px;
      }
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1);   filter: drop-shadow(0 0 8px rgba(37,99,235,0.4)); }
      50%        { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(59,130,246,0.7)); }
    }

    .logo-cruz svg {
      width: 100%;
      height: 100%;
    }

    .nombre-iglesia {
      text-align: center;
    }

    .nombre-iglesia h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    @media (min-width: 1024px) {
      .nombre-iglesia h1 {
        font-size: 2.2rem;
      }
    }

    @media (min-width: 1200px) {
      .nombre-iglesia h1 {
        font-size: 2.8rem;
      }
    }

    .nombre-iglesia h1 span {
      color: var(--color-azul-claro);
    }

    .subtitulo {
      font-size: 0.8rem;
      color: var(--color-texto-suave);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .separador {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-azul), transparent);
      margin: 20px auto 0;
    }

    /* ---- EVENTO DESTACADO ---- */
    .evento-destacado {
      width: 100%;
      background: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(37,99,235,0.05) 100%);
      border: 2px solid var(--color-evento);
      border-radius: var(--radio-card);
      padding: 24px;
      margin-bottom: 32px;
      animation: pulso-evento 2.5s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes pulso-evento {
      0%, 100% {
        border-color: var(--color-evento);
        box-shadow: 0 0 15px rgba(37,99,235,0.2);
      }
      50% {
        border-color: #60A5FA;
        box-shadow: 0 0 25px rgba(37,99,235,0.4);
      }
    }

    .evento-badge {
      display: inline-block;
      background: var(--color-evento);
      color: var(--color-blanco);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .evento-titulo {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--color-blanco);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .evento-fecha {
      font-size: 0.85rem;
      color: var(--color-azul-claro);
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .evento-descripcion {
      font-size: 0.8rem;
      color: var(--color-texto-suave);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    @media (min-width: 1024px) {
      .evento-titulo {
        font-size: 1.5rem;
      }
      .evento-fecha {
        font-size: 0.95rem;
      }
      .evento-descripcion {
        font-size: 0.9rem;
      }
    }

    @media (min-width: 1200px) {
      .evento-titulo {
        font-size: 1.7rem;
      }
      .evento-fecha {
        font-size: 1rem;
      }
      .evento-descripcion {
        font-size: 1rem;
      }
    }

    .evento-bloques {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bloque-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px;
      background: rgba(37,99,235,0.08);
      border-radius: 8px;
      border-left: 3px solid var(--color-azul-claro);
      width: 100%;
      transition: all 0.3s ease;
    }

    .bloque-hora {
      flex-shrink: 0;
      font-weight: 700;
      color: var(--color-azul-claro);
      font-size: 0.75rem;
      min-width: 55px;
    }

    /* ---- CARRUSEL ROTATIVO ---- */
    .carousel-container {
      width: 100%;
      margin-bottom: 32px;
      position: relative;
    }

    @media (min-width: 1024px) {
      .carousel-container {
        grid-column: 1 / -1;
        margin-bottom: 24px;
      }
    }

    .carousel-wrapper {
      width: 100%;
      overflow: clip;
      border-radius: var(--radio-card);
      touch-action: pan-y pinch-zoom;
      user-select: none;
      cursor: grab;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      position: relative;
      min-height: 420px;
    }

    .carousel-wrapper.grabbing {
      cursor: grabbing;
    }

    .carousel-slide {
      width: 100%;
      max-width: 100%;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      padding: 24px;
      animation: destello-borde 3s ease-in-out infinite;
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      right: 0;
    }

    @media (min-width: 1024px) {
      .carousel-slide {
        padding: 32px;
      }
    }

    @media (min-width: 1200px) {
      .carousel-slide {
        padding: 40px;
      }
    }

    .carousel-slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
      position: relative;
    }

    .carousel-slide.prev {
      transform: translateX(-100%);
    }

    .slide-evento.active {
      background: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(37,99,235,0.05) 100%);
      border: 2px solid var(--color-azul-claro);
      animation: pulso-evento 2.5s ease-in-out infinite;
    }

    .schedule-card-carousel {
      width: 100%;
    }

    .schedule-card-carousel .schedule-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-azul-claro);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .schedule-card-carousel .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(30, 58, 138, 0.3);
      font-size: 0.85rem;
      transition: background 0.3s ease, border-left 0.3s ease;
      padding-left: 12px;
      margin-left: -12px;
      margin-right: -12px;
      padding-right: 12px;
    }

    .schedule-card-carousel .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-card-carousel .schedule-row.dia-actual {
      background: rgba(37, 99, 235, 0.15);
      border-left: 4px solid var(--color-azul-claro);
      padding-left: 8px;
    }

    /* Indicadores */
    .carousel-indicators {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--color-azul);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }

    .dot.active {
      background: var(--color-azul-claro);
      box-shadow: 0 0 10px rgba(59,130,246,0.5);
    }

    .dot:hover {
      box-shadow: 0 0 8px rgba(59,130,246,0.3);
    }

    /* ---- RESPONSIVO DESKTOP ---- */
    @media (min-width: 1024px) {
      .carousel-wrapper {
        flex-wrap: nowrap;
        gap: 20px;
        overflow: visible;
        touch-action: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .carousel-slide {
        width: 100%;
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
        position: relative;
        transition: none;
      }

      .carousel-slide.active,
      .carousel-slide.prev {
        opacity: 1;
        transform: translateX(0);
      }

      .carousel-indicators {
        display: none;
      }
    }

    @media (min-width: 1400px) {
      .carousel-wrapper {
        grid-template-columns: 1fr 1fr;
      }
    }

    .bloque-nombre {
      flex: 1;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-blanco);
      line-height: 1.3;
    }

    /* ---- TARJETA DE HORARIOS ---- */
    .schedule-card {
      width: 100%;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      padding: 20px;
      margin-bottom: 32px;
      animation: destello-borde 3s ease-in-out infinite;
    }

    @media (min-width: 1024px) {
      .schedule-card {
        padding: 28px;
      }
    }

    @media (min-width: 1200px) {
      .schedule-card {
        padding: 36px;
      }
    }

    .schedule-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-azul-claro);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(30, 58, 138, 0.3);
      font-size: 0.85rem;
      transition: background 0.3s ease, border-left 0.3s ease;
      padding-left: 12px;
      margin-left: -12px;
      margin-right: -12px;
      padding-right: 12px;
    }

    @media (min-width: 1024px) {
      .schedule-title {
        font-size: 1.05rem;
      }
      .schedule-row {
        font-size: 0.95rem;
        padding: 16px 0;
      }
    }

    @media (min-width: 1200px) {
      .schedule-title {
        font-size: 1.15rem;
      }
      .schedule-row {
        font-size: 1rem;
        padding: 18px 0;
      }
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row.dia-actual {
      background: rgba(37, 99, 235, 0.15);
      border-left: 4px solid var(--color-azul-claro);
      padding-left: 8px;
    }

    .schedule-dia {
      font-weight: 700;
      color: var(--color-azul-claro);
      min-width: 85px;
    }

    .schedule-row.dia-actual .schedule-dia {
      color: var(--color-azul-claro);
      text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }

    .schedule-evento {
      flex: 1;
      color: var(--color-texto-suave);
      padding: 0 12px;
      text-align: left;
    }

    .schedule-row.dia-actual .schedule-evento {
      color: var(--color-blanco);
      font-weight: 600;
    }

    .schedule-hora {
      color: var(--color-texto-suave);
      font-weight: 600;
      min-width: 55px;
      text-align: right;
    }

    .schedule-row.dia-actual .schedule-hora {
      color: var(--color-azul-claro);
      text-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }

    /* ---- TARJETA DE UBICACIÓN / GOOGLE MAPS ---- */
    .location-card {
      width: 100%;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      padding: 16px;
      margin-bottom: 32px;
      animation: destello-borde 3s ease-in-out infinite;
      overflow: hidden;
    }

    @media (min-width: 1024px) {
      .location-card {
        grid-column: 1 / -1;
      }
    }

    .location-card iframe {
      display: block;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    @media (min-width: 1024px) {
      .location-card iframe {
        height: 300px;
      }
    }

    @media (min-width: 1200px) {
      .location-card iframe {
        height: 350px;
      }
    }

    .location-info {
      text-align: center;
      margin-bottom: 12px;
    }

    .location-info p {
      color: var(--color-texto-suave);
      font-size: 0.9rem;
      margin: 4px 0;
    }

    .location-info strong {
      color: var(--color-blanco);
    }

    .btn-maps {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--color-azul-claro), var(--color-azul));
      color: var(--color-blanco);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-maps:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    /* ---- SECCIÓN (agrupador opcional) ---- */
    .seccion-titulo {
      width: 100%;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
      margin: 40px 0 16px;
      padding-left: 4px;
    }

    @media (min-width: 1024px) {
      .seccion-titulo {
        grid-column: 1 / -1;
        margin: 24px 0 12px;
      }
    }

    /* ---- CARDS DE LINKS ---- */
    .links-lista {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 8px;
    }

    @media (min-width: 1024px) {
      .links-lista {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
    }

    @media (min-width: 1400px) {
      .links-lista {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      text-decoration: none;
      color: var(--color-blanco);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      position: relative;
      overflow: hidden;
      animation: destello-borde 3s ease-in-out infinite;
    }

    @media (min-width: 1024px) {
      .link-card {
        padding: 20px 28px;
        gap: 20px;
      }
    }

    @media (min-width: 1200px) {
      .link-card {
        padding: 24px 32px;
        gap: 24px;
      }
    }

    @keyframes destello-borde {
      0%, 100% { border-color: var(--color-borde); box-shadow: none; }
      50% { border-color: var(--color-azul-claro); box-shadow: 0 0 15px rgba(59,130,246,0.4), inset 0 0 15px rgba(59,130,246,0.1); }
    }

    .link-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(59,130,246,0.3), 0 4px 12
