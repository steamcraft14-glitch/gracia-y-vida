<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Gracia & Vida Huechuraba</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-fondo:        #0B0F1E;
      --color-fondo-card:   #111827;
      --color-borde:        #1E3A8A;
      --color-azul:         #2563EB;
      --color-azul-claro:   #3B82F6;
      --color-blanco:       #FFFFFF;
      --color-texto-suave:  #94A3B8;
      --color-evento:       #2563EB;
      --font-principal:     'Montserrat', sans-serif;
      --radio-card:         14px;
      --max-ancho:          480px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      overflow-x: hidden;
      width: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-principal);
      background-color: var(--color-fondo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 64px;
      color: var(--color-blanco);
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }

    @media (min-width: 1024px) {
      body {
        padding: 48px 0 64px;
      }
    }

    @media (min-width: 1200px) {
      body {
        padding: 60px 0 80px;
      }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(37,99,235,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(30,58,138,0.2) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .contenedor {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--max-ancho);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      overflow-x: hidden;
    }

    @media (min-width: 1024px) {
      .contenedor {
        max-width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 0 40px;
        align-items: start;
        overflow-x: visible;
      }
    }

    @media (min-width: 1400px) {
      .contenedor {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 28px;
        padding: 0 60px;
      }
    }

    .cabecera {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    @media (min-width: 1024px) {
      .cabecera {
        grid-column: 1 / -1;
        margin-bottom: 24px;
      }
    }

    .logo-cruz {
      width: 200px;
      height: 200px;
      position: relative;
      animation: pulso 3s ease-in-out infinite;
    }

    @media (min-width: 1024px) {
      .logo-cruz {
        width: 240px;
        height: 240px;
      }
    }

    @media (min-width: 1200px) {
      .logo-cruz {
        width: 280px;
        height: 280px;
      }
    }

    @keyframes pulso {
      0%, 100% { transform: scale(1);   filter: drop-shadow(0 0 8px rgba(37,99,235,0.4)); }
      50%       { transform: scale(1.05); filter: drop-shadow(0 0 18px rgba(59,130,246,0.7)); }
    }

    .logo-cruz img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nombre-iglesia {
      text-align: center;
    }

    .nombre-iglesia h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    @media (min-width: 1024px) {
      .nombre-iglesia h1 {
        font-size: 2.2rem;
      }
    }

    @media (min-width: 1200px) {
      .nombre-iglesia h1 {
        font-size: 2.8rem;
      }
    }

    .nombre-iglesia h1 span {
      color: var(--color-azul-claro);
    }

    .subtitulo {
      font-size: 0.8rem;
      color: var(--color-texto-suave);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .separador {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-azul), transparent);
      margin: 20px auto 0;
    }

    .carousel-container {
      width: 100%;
      margin-bottom: 32px;
      position: relative;
    }

    @media (min-width: 1024px) {
      .carousel-container {
        grid-column: 1 / -1;
        margin-bottom: 24px;
      }
    }

    .carousel-wrapper {
      width: 100%;
      overflow: clip;
      border-radius: var(--radio-card);
      touch-action: pan-y pinch-zoom;
      user-select: none;
      cursor: grab;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      position: relative;
      min-height: 420px;
    }

    .carousel-slide {
      width: 100%;
      max-width: 100%;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      padding: 24px;
      animation: destello-borde 3s ease-in-out infinite;
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      right: 0;
    }

    @media (min-width: 1024px) {
      .carousel-slide {
        padding: 32px;
      }
    }

    @media (min-width: 1200px) {
      .carousel-slide {
        padding: 40px;
      }
    }

    .carousel-slide.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
      position: relative;
    }

    .carousel-slide.prev {
      transform: translateX(-100%);
    }

    .slide-evento.active {
      background: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(37,99,235,0.05) 100%);
      border: 2px solid var(--color-azul-claro);
      animation: pulso-evento 2.5s ease-in-out infinite;
    }

    @keyframes pulso-evento {
      0%, 100% {
        border-color: var(--color-evento);
        box-shadow: 0 0 15px rgba(37,99,235,0.2);
      }
      50% {
        border-color: #60A5FA;
        box-shadow: 0 0 25px rgba(37,99,235,0.4);
      }
    }

    .evento-badge {
      display: inline-block;
      background: var(--color-evento);
      color: var(--color-blanco);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .evento-titulo {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--color-blanco);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .evento-fecha {
      font-size: 0.85rem;
      color: var(--color-azul-claro);
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .evento-descripcion {
      font-size: 0.8rem;
      color: var(--color-texto-suave);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    @media (min-width: 1024px) {
      .evento-titulo {
        font-size: 1.5rem;
      }
      .evento-fecha {
        font-size: 0.95rem;
      }
      .evento-descripcion {
        font-size: 0.9rem;
      }
    }

    @media (min-width: 1200px) {
      .evento-titulo {
        font-size: 1.7rem;
      }
      .evento-fecha {
        font-size: 1rem;
      }
      .evento-descripcion {
        font-size: 1rem;
      }
    }

    .evento-bloques {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bloque-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px;
      background: rgba(37,99,235,0.08);
      border-radius: 8px;
      border-left: 3px solid var(--color-azul-claro);
    }

    .bloque-hora {
      flex-shrink: 0;
      font-weight: 700;
      color: var(--color-azul-claro);
      font-size: 0.75rem;
      min-width: 55px;
    }

    .bloque-nombre {
      flex: 1;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-blanco);
      line-height: 1.3;
    }

    .schedule-card-carousel {
      width: 100%;
    }

    .schedule-card-carousel .schedule-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-azul-claro);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(30, 58, 138, 0.3);
      font-size: 0.85rem;
      transition: background 0.3s ease;
      padding-left: 12px;
      margin-left: -12px;
      margin-right: -12px;
      padding-right: 12px;
    }

    .schedule-row:last-child {
      border-bottom: none;
    }

    .schedule-row.dia-actual {
      background: rgba(37, 99, 235, 0.15);
      border-left: 4px solid var(--color-azul-claro);
      padding-left: 8px;
    }

    .schedule-dia {
      font-weight: 700;
      color: var(--color-azul-claro);
      min-width: 85px;
    }

    .schedule-evento {
      flex: 1;
      color: var(--color-texto-suave);
      padding: 0 12px;
      text-align: left;
    }

    .schedule-hora {
      color: var(--color-texto-suave);
      font-weight: 600;
      min-width: 55px;
      text-align: right;
    }

    .carousel-indicators {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--color-azul);
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
    }

    .dot.active {
      background: var(--color-azul-claro);
      box-shadow: 0 0 10px rgba(59,130,246,0.5);
    }

    @media (min-width: 1024px) {
      .carousel-wrapper {
        flex-wrap: nowrap;
        gap: 20px;
        overflow: visible;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .carousel-slide {
        width: 100%;
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
        position: relative;
      }

      .carousel-indicators {
        display: none;
      }
    }

    .location-card {
      width: 100%;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      padding: 16px;
      margin-bottom: 32px;
      animation: destello-borde 3s ease-in-out infinite;
      overflow: hidden;
    }

    @media (min-width: 1024px) {
      .location-card {
        grid-column: 1 / -1;
      }
    }

    .location-card iframe {
      display: block;
      border-radius: 10px;
      margin-bottom: 16px;
      width: 100%;
      height: 280px;
    }

    @media (min-width: 1024px) {
      .location-card iframe {
        height: 300px;
      }
    }

    .location-info {
      text-align: center;
      margin-bottom: 12px;
    }

    .location-info p {
      color: var(--color-texto-suave);
      font-size: 0.9rem;
      margin: 4px 0;
    }

    .location-info strong {
      color: var(--color-blanco);
    }

    .btn-maps {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--color-azul-claro), var(--color-azul));
      color: var(--color-blanco);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-maps:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    .seccion-titulo {
      width: 100%;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-texto-suave);
      margin: 40px 0 16px;
      padding-left: 4px;
    }

    @media (min-width: 1024px) {
      .seccion-titulo {
        grid-column: 1 / -1;
        margin: 24px 0 12px;
      }
    }

    .links-lista {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 8px;
    }

    @media (min-width: 1024px) {
      .links-lista {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
    }

    @media (min-width: 1400px) {
      .links-lista {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--color-fondo-card);
      border: 2px solid var(--color-borde);
      border-radius: var(--radio-card);
      text-decoration: none;
      color: var(--color-blanco);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
      animation: destello-borde 3s ease-in-out infinite;
    }

    @media (min-width: 1024px) {
      .link-card {
        padding: 20px 28px;
        gap: 20px;
      }
    }

    .link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(59,130,246,0.3), 0 4px 12px rgba(0,0,0,0.4);
    }

    @keyframes destello-borde {
      0%, 100% {
        border-color: var(--color-borde);
        box-shadow: none;
      }
      50% {
        border-color: var(--color-azul-claro);
        box-shadow: 0 0 15px rgba(59,130,246,0.4), inset 0 0 15px rgba(59,130,246,0.1);
      }
    }

    .icono-wrap {
      flex-shrink: 0;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    @media (min-width: 1024px) {
      .icono-wrap {
        width: 50px;
        height: 50px;
        font-size: 1.4rem;
      }
    }

    .ic-spotify  { color: #1ED760; }
    .ic-youtube  { color: #FF4444; }
    .ic-ig       { color: #E1306C; }
    .ic-facebook { color: #4F9EF8; }
    .ic-nuevo    { color: #4ADE80; }
    .ic-oracion  { color: #F87171; }
    .ic-ofrenda  { color: #60A5FA; }
    .ic-jovenes  { color: #C084FC; }
    .ic-youversion { color: #FF6B35; }

    .link-texto {
      flex: 1;
    }

    .link-nombre {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .link-desc {
      font-size: 0.75rem;
      color: var(--color-texto-suave);
      margin-top: 2px;
    }

    .link-flecha {
      flex-shrink: 0;
      color: var(--color-texto-suave);
      font-size: 1rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-card:hover .link-flecha {
      transform: translateX(4px);
      color: var(--color-azul-claro);
    }

    .pie {
      margin-top: 48px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--color-texto-suave);
      line-height: 1.6;
    }

    @media (min-width: 1024px) {
      .pie {
        grid-column: 1 / -1;
      }
    }

    .pie a {
      color: var(--color-azul-claro);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="contenedor">

  <header class="cabecera">
    <div class="logo-cruz">
      <img src="logo.png" alt="Logo Gracia & Vida" />
    </div>

    <div class="nombre-iglesia">
      <h1>Gracia <span>&</span> Vida</h1>
      <p class="subtitulo">Iglesia · Huechuraba</p>
      <div class="separador"></div>
    </div>
  </header>

  <!-- CARRUSEL CON EVENTO Y HORARIOS DINÁMICOS -->
  <div class="carousel-container">
    <div class="carousel-wrapper">
      <div id="carousel-evento" class="carousel-slide slide-evento"></div>
      <div id="carousel-horarios" class="carousel-slide slide-schedule"></div>
    </div>
    <div class="carousel-indicators">
      <button class="dot active" data-slide="0" aria-label="Ir a evento destacado"></button>
      <button class="dot" data-slide="1" aria-label="Ir a reuniones semanales"></button>
    </div>
  </div>

  <!-- UBICACIÓN -->
  <p class="seccion-titulo">📍 ¿Cómo Llegar?</p>

  <div class="location-card">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3330.889!2d-70.5593!3d-33.3745!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9629a1a1a1a1a1a1%3A0x1234567890abcdef!2sPedro%20Fontova%207492%2C%20Huechuraba!5e0!3m2!1ses!2scl!4v1693456789012" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    
    <div class="location-info">
      <p style="color: var(--color-azul-claro); font-weight: 700; margin-bottom: 8px;">Gracia & Vida</p>
      <p>Pedro Fontova 7492</p>
      <p>Huechuraba, Santiago</p>
    </div>
    
    <center>
      <a href="https://maps.app.goo.gl/X1B42V2HqRagSYYw5" target="_blank" rel="noopener" class="btn-maps">
        Abrir en Google Maps →
      </a>
    </center>
  </div>

  <!-- SECCIONES DINÁMICAS -->
  <div id="secciones-container"></div>

  <footer class="pie">
    <p>Iglesia Gracia & Vida · Huechuraba, Santiago</p>
    <p style="margin-top:6px;">Síguenos y forma parte de la comunidad</p>
  </footer>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // ⚠️ REEMPLAZA ESTO CON TUS CREDENCIALES DE FIREBASE
  const firebaseConfig = {
  apiKey: "AIzaSyDIibIy0oBXya6jQLLmtzq2TFB-Jiaa1_o",
  authDomain: "gracia-vida.firebaseapp.com",
  projectId: "gracia-vida",
  storageBucket: "gracia-vida.firebasestorage.app",
  messagingSenderId: "901432766248",
  appId: "1:901432766248:web:8dcbb7048284c152ae2a1d",
  measurementId: "G-PVWF066PNY"

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.scrollTo(0, 0);

  // ===== EVENTO DESTACADO =====
  onSnapshot(doc(db, "iglesia", "evento_destacado"), (docSnap) => {
    if (docSnap.exists()) {
      const datos = docSnap.data();
      let html = `
        <span class="evento-badge">⚡ Próximo evento</span>
        <h2 class="evento-titulo">${datos.titulo || ""}</h2>
        <p class="evento-fecha">${datos.fecha || ""}</p>
        <p class="evento-descripcion">${datos.descripcion || ""}</p>
      `;

      if (datos.bloques && datos.bloques.length > 0) {
        html += '<div class="evento-bloques">';
        datos.bloques.forEach(bloque => {
          html += `
            <div class="bloque-item">
              <div class="bloque-hora">${bloque.hora}</div>
              <div class="bloque-nombre">${bloque.nombre}</div>
            </div>
          `;
        });
        html += '</div>';
      }

      document.getElementById('carousel-evento').innerHTML = html;
    }
  });

  // ===== HORARIOS DINÁMICOS =====
  const dayMap = {
    0: 'domingo',
    1: 'lunes',
    2: 'martes',
    3: 'miércoles',
    4: 'jueves',
    5: 'viernes',
    6: 'sábado'
  };

  onSnapshot(doc(db, "iglesia", "reuniones"), (docSnap) => {
    if (docSnap.exists()) {
      const datos = docSnap.data();
      const reuniones = datos.items || [];
      
      let html = '<div class="schedule-card-carousel"><div class="schedule-title">📅 Reuniones de la Semana</div>';
      
      reuniones.forEach(r => {
        const normalizeText = (text) => {
          return text
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');
        };
        
        const today = new Date().getDay();
        const todayName = dayMap[today];
        const isToday = normalizeText(r.dia) === normalizeText(todayName);
        
        html += `
          <div class="schedule-row" ${isToday ? 'style="background: rgba(37, 99, 235, 0.15); border-left: 4px solid var(--color-azul-claro);"' : ''}>
            <div class="schedule-dia">${r.dia}${isToday ? ' (Hoy)' : ''}</div>
            <div class="schedule-evento">${r.evento}</div>
            <div class="schedule-hora">${r.hora}</div>
          </div>
        `;
      });
      
      html += '</div></div>';
      document.getElementById('carousel-horarios').innerHTML = html;
    }
  });

  // ===== SECCIONES DINÁMICAS =====
  onSnapshot(doc(db, "iglesia", "secciones"), (docSnap) => {
    if (docSnap.exists()) {
      const datos = docSnap.data();
      const secciones = datos.items || [];
      let html = '';
      
      secciones.forEach(seccion => {
        html += `<p class="seccion-titulo">${seccion.titulo}</p><div class="links-lista">`;
        
        (seccion.links || []).forEach(link => {
          const icon = getIconForLink(link.nombre);
          html += `
            <a class="link-card" href="${link.url}" target="_blank" rel="noopener">
              <div class="icono-wrap ${icon.clase}">
                ${icon.svg}
              </div>
              <div class="link-texto">
                <div class="link-nombre">${link.nombre}</div>
                <div class="link-desc">${link.descripcion}</div>
              </div>
              <span class="link-flecha">→</span>
            </a>
          `;
        });
        
        html += '</div>';
      });
      
      document.getElementById('secciones-container').innerHTML = html;
    }
  });

  function getIconForLink(nombre) {
    const iconos = {
      'youtube': { clase: 'ic-youtube', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.4 5 12 5 12 5s-4.4 0-7 .1c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.8 2.3.9C6.8 19 12 19 12 19s4.4 0 7-.1c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"/></svg>' },
      'instagram': { clase: 'ic-ig', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.9.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8 0 3.2 0 3.6-.1 4.8-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.9.1-3.2 0-3.6 0-4.8-.1-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.3 2.2 12c0-3.2 0-3.6.1-4.8C2.4 3.9 4 2.3 7.2 2.2c1.2-.1 1.6-.1 4.8-.1zm0-2.2C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12c0 3.3 0 3.7.1 4.9.2 4.4 2.6 6.8 7 7C8.3 24 8.7 24 12 24c3.3 0 3.7 0 4.9-.1 4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9 0-3.3 0-3.7-.1-4.9-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 100 12.4A6.2 6.2 0 0012 5.8zM12 16a4 4 0 110-8 4 4 0 010 8zm6.4-11.8a1.44 1.44 0 100 2.88 1.44 1.44 0 000-2.88z"/></svg>' },
      'facebook': { clase: 'ic-facebook', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.886v2.268h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>' },
      'spotify': { clase: 'ic-spotify', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>' },
      'youversion': { clase: 'ic-youversion', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 16H5V4h14v14zM7 10h10v2H7z"/></svg>' }
    };

    for (const [key, icon] of Object.entries(iconos)) {
      if (nombre.toLowerCase().includes(key)) {
        return icon;
      }
    }

    return { clase: 'ic-nuevo', svg: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>' };
  }

  // ===== CARRUSEL MÓVIL =====
  const slides = document.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('.dot');
  const carouselWrapper = document.querySelector('.carousel-wrapper');
  
  let currentSlide = 0;
  let autoRotateInterval;
  const isMobile = window.innerWidth < 1024;

  function showSlide(n) {
    slides.forEach((slide, index) => {
      slide.classList.remove('active', 'prev');
      if (index === n) {
        slide.classList.add('active');
      } else if (index < n) {
        slide.classList.add('prev');
      }
    });
    
    dots.forEach((dot, index) => {
      dot.classList.remove('active');
      if (index === n) dot.classList.add('active');
    });
    
    currentSlide = n;
  }

  function nextSlide() {
    showSlide((currentSlide + 1) % slides.length);
  }

  function startAutoRotate() {
    if (!isMobile) return;
    autoRotateInterval = setInterval(nextSlide, 7000);
  }

  function stopAutoRotate() {
    clearInterval(autoRotateInterval);
  }

  if (isMobile) {
    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        stopAutoRotate();
        showSlide(index);
        startAutoRotate();
      });
    });

    let touchStartX = 0;
    carouselWrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      stopAutoRotate();
    }, { passive: true });

    carouselWrapper.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) nextSlide();
        else showSlide((currentSlide - 1 + slides.length) % slides.length);
      }
      startAutoRotate();
    }, { passive: false });

    carouselWrapper.addEventListener('mouseenter', stopAutoRotate);
    carouselWrapper.addEventListener('mouseleave', startAutoRotate);

    showSlide(0);
    startAutoRotate();
  } else {
    slides.forEach(slide => slide.classList.add('active'));
  }
</script>

</body>
</html>
